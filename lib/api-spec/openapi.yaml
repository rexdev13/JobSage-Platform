              schema:
                $ref: "#/components/schemas/SponsorLicenceSyncResult"

  /admin/sponsor-website-import/preview:
    post:
      tags: [SuperAdmin]
      operationId: previewSponsorWebsiteImport
      summary: Preview a sponsor website CSV against the current database (super admin only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SponsorWebsiteImportPreviewUpload"
      responses:
        "200":
          description: Read-only reconciliation preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorWebsiteImportPreview"
        "400":
          description: Invalid CSV or missing fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Super-admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/sponsor-website-import/resolve:
    post:
      tags: [SuperAdmin]
      operationId: resolveSponsorWebsiteIdentity
      summary: Save a reviewed sponsor identity crosswalk (super admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorWebsiteIdentityResolutionInput"
      responses:
        "200":
          description: Reviewed identity mapping saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorWebsiteIdentityResolution"
        "400":
          description: Invalid identity mapping or review reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Super-admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The selected production sponsor conflicts with the identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/sponsor-website-import/apply:
    post:
      tags: [SuperAdmin]
      operationId: applySponsorWebsiteImport
      summary: Apply the unchanged, reviewed safe rows from a sponsor website preview (super admin only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SponsorWebsiteImportApplyUpload"
      responses:
        "200":
          description: Safe blank-field updates applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorWebsiteImportResult"
        "400":
          description: Invalid CSV or preview hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Super-admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The preview is stale or applying is not allowed in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/sponsor-website-import/stage:
    post:
      tags: [SuperAdmin]
      operationId: stageSponsorWebsiteImportReview
      summary: Store held sponsor URL candidates in the durable review queue (super admin only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SponsorWebsiteImportStageUpload"
      responses:
        "200":
          description: Held candidates were stored without changing live sponsor or vacancy-source data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorWebsiteImportStageResult"
        "400":
          description: Invalid CSV or preview hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Super-admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The preview is stale or staging is not allowed in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/sponsor-website-import/staging:
    get:
      tags: [SuperAdmin]
      operationId: listSponsorWebsiteImportStaging
      summary: List staged sponsor URL candidates for review (super admin only)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, resolved, rejected]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Staged candidates and total matching count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorWebsiteImportStagingList"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Super-admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    SponsorWebsiteImportPreviewUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    SponsorWebsiteImportApplyUpload:
      type: object
      required: [file, planHash]
      properties:
        file:
          type: string
          format: binary
        planHash:
          type: string
          pattern: "^[a-f0-9]{64}$"

    SponsorWebsiteImportStageUpload:
      type: object
      required: [file, planHash]
      properties:
        file:
          type: string
          format: binary
        planHash:
          type: string
          pattern: "^[a-f0-9]{64}$"

    SponsorWebsiteIdentity:
      type: object
      required: [organisationName, townCity, county, region, industry, route, subRoute]
      properties:
        organisationName: { type: string }
        townCity: { type: string }
        county: { type: string }
        region: { type: string }
        industry: { type: string }
        route: { type: string }
        subRoute: { type: string }

    SponsorWebsiteIdentityCandidate:
      type: object
      required: [id, organisationName, townCity, county, region, industry, route, subRoute]
      properties:
        id: { type: integer }
        organisationName: { type: string }
        townCity: { type: string }
        county: { type: string }
        region: { type: string }
        industry: { type: string }
        route: { type: string }
        subRoute: { type: string }

    SponsorWebsiteImportRow:
      type: object
      required:
        - sourceRef
        - field
        - identityKey
        - identity
        - organisationName
        - candidateUrl
        - evidenceUrl
        - status
        - reason
        - targetSponsorLicenceId
        - targetSponsorLicenceIds
        - targetCompanySiteCheckId
        - currentValue
        - productionCandidates
      properties:
        sourceRef: { type: string }
        field: { type: string, enum: [website, careers] }
        identityKey: { type: string }
        identity:
          $ref: "#/components/schemas/SponsorWebsiteIdentity"
        organisationName: { type: string }
        candidateUrl: { type: string }
        evidenceUrl: { type: string }
        status: { type: string }
        reason: { type: string }
        targetSponsorLicenceId:
          type: [integer, "null"]
        targetSponsorLicenceIds:
          type: array
          items:
            type: integer
        targetCompanySiteCheckId:
          type: [integer, "null"]
        currentValue: { type: string }
        productionCandidates:
          type: array
          items:
            $ref: "#/components/schemas/SponsorWebsiteIdentityCandidate"

    SponsorWebsiteImportPreview:
      type: object
      required: [environment, rowCount, planHash, counts, writeCount, rows]
      properties:
        environment: { type: string }
        rowCount: { type: integer }
        planHash: { type: string }
        counts:
          type: object
          additionalProperties: { type: integer }
        writeCount: { type: integer }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SponsorWebsiteImportRow"

    SponsorWebsiteIdentityResolutionInput:
      type: object
      required: [identity, targetSponsorLicenceId, reason]
      properties:
        identity:
          $ref: "#/components/schemas/SponsorWebsiteIdentity"
        targetSponsorLicenceId: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 8, maxLength: 500 }

    SponsorWebsiteIdentityResolution:
      type: object
      required: [saved, identityKey, targetSponsorLicenceId]
      properties:
        saved: { type: boolean }
        identityKey: { type: string }
        targetSponsorLicenceId: { type: integer }

    SponsorWebsiteImportResult:
      type: object
      required: [applied, planHash, websiteUpdates, careersUpdates, mappingsStored, counts]
      properties:
        applied: { type: boolean }
        planHash: { type: string }
        websiteUpdates: { type: integer }
        careersUpdates: { type: integer }
        mappingsStored: { type: integer }
        counts:
          type: object
          additionalProperties: { type: integer }

    SponsorWebsiteImportStageResult:
      type: object
      required: [planHash, stagedCount, alreadyStagedCount, heldCount]
      properties:
        planHash: { type: string }
        stagedCount: { type: integer }
        alreadyStagedCount: { type: integer }
        heldCount: { type: integer }

    SponsorWebsiteImportStagingRow:
      type: object
      required:
        - id
        - sourceRef
        - field
        - organisationName
        - candidateUrl
        - evidenceUrl
        - identitySnapshot
        - candidateSnapshot
        - productionCandidates
        - resolverStatus
        - resolverReason
        - reviewStatus
        - createdAt
      properties:
        id: { type: integer }
        sourceRef: { type: string }
        field: { type: string, enum: [website, careers] }
        organisationName: { type: string }
        candidateUrl: { type: string }
        evidenceUrl: { type: string }
        identitySnapshot:
          type: object
          additionalProperties: { type: string }
        candidateSnapshot:
          type: object
          additionalProperties: { type: string }
        productionCandidates:
          type: array
          items:
            type: object
            additionalProperties: {}
        resolverStatus: { type: string }
        resolverReason: { type: string }
        reviewStatus: { type: string, enum: [pending, resolved, rejected] }
        createdAt: { type: string, format: date-time }

    SponsorWebsiteImportStagingList:
      type: object
      required: [environment, total, rows]
      properties:
        environment: { type: string }
        total: { type: integer }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SponsorWebsiteImportStagingRow"

    SponsorLicenceSyncResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        recordCount:
          type: number
          nullable: true
        syncedAt:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        emailVerified:
          type: boolean
          nullable: true
        role:
          type: string
          enum: [candidate, admin, reviewer, employer, super_admin, marketing]
          nullable: true

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
        isImpersonating:
          type: boolean
          description: True when the session is operating under impersonation of another user.
        token:
          type: string
          description: Session token for mobile clients to use as a Bearer token. Only returned on login.

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    RegisterSuccess:
      type: object
      required: [message, userId]
      properties:
        message:
          type: string
        userId:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8

    MessageEnvelope:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, storageKey]
      properties:
        uploadURL:
          type: string
          format: uri
        storageKey:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    DbsClearanceLevel:
      type: string
      enum: [unknown, none, basic, standard, enhanced]

    SafeguardingTrainingLevel:
      type: string
      enum: [unknown, none, level_1, level_2]

    SafeguardingStatus:
      type: string
      enum: [unknown, unknown_needs_profile, missing, met]

    SafeguardingAssessment:
      type: object
      required: [requiredDbsClearanceLevel, requiredSafeguardingLevel, dbsStatus, safeguardingStatus]
      properties:
        requiredDbsClearanceLevel:
          allOf:
            - $ref: '#/components/schemas/DbsClearanceLevel'
          nullable: true
        requiredSafeguardingLevel:
          allOf:
            - $ref: '#/components/schemas/SafeguardingTrainingLevel'
          nullable: true
        dbsStatus:
          $ref: '#/components/schemas/SafeguardingStatus'
        safeguardingStatus:
          $ref: '#/components/schemas/SafeguardingStatus'

    CandidateProfile:
      type: object
      required: [id, userId, profession, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        profession:
          type: string
          description: The candidate's profession (free text; well-known values are suggested on the client).
        specialty:
          type: string
          nullable: true
        qualificationCountry:
          type: string
          nullable: true
        qualificationType:
          type: string
          nullable: true
        qualificationYear:
          type: integer
          nullable: true
        experienceYears:
          type: integer
          nullable: true
        registrationStatus:
          type: string
          enum: [registered, not_registered, in_process]
          nullable: true
        licenceReady:
          type: boolean
          nullable: true
        dbsClearanceLevel:
          $ref: '#/components/schemas/DbsClearanceLevel'
        safeguardingTrainingLevel:
          $ref: '#/components/schemas/SafeguardingTrainingLevel'
        residencyStatus:
          type: string
          nullable: true
        requiresSponsorship:
          type: boolean
          nullable: true
        preferredRegion:
          type: array
          items:
            type: string
          nullable: true
        alertFrequency:
          type: string
          enum: [daily, weekly, off]
          nullable: true
          default: weekly
          description: Weekly at launch. The daily value is retained only for backwards-compatible clients and is treated as weekly.
        lastAlertSentAt:
          type: string
          format: date-time
          nullable: true
        boostProfile:
          type: boolean
        preferredStartDate:
          type: string
          nullable: true
          description: Target start date (ISO date string, e.g. 2025-06-01)
        profilePhotoKey:
          type: string
          nullable: true
          description: Object storage key for the profile photo
        languages:
          type: array
          nullable: true
          description: Languages spoken
          items:
            type: string
        additionalNotes:
          type: string
          nullable: true
          description: Free-text notes the candidate wants employers to see
        phone:
          type: string
          nullable: true
          description: Candidate contact phone number for application-form prefill
        streetAddress:
          type: string
          nullable: true
          description: Candidate street address for application-form prefill
        city:
          type: string
          nullable: true
          description: Candidate town or city for application-form prefill
        postcode:
          type: string
          nullable: true
          description: Candidate postcode for application-form prefill
        country:
          type: string
          nullable: true
          description: Candidate country for application-form prefill
        jobsageEmail:
          type: string
          nullable: true
          description: Auto-assigned JOBSAGE communication alias (e.g. jane.smith.a1b2c3@mail.jobsage.app). Used in place of personal email when CVs are sent to employers.
        completionPct:
          type: integer
          description: Profile completeness score (0–100), computed server-side
        missingFields:
          type: array
          items:
            type: string
          description: Labels of fields still needed for 100% profile completeness, computed from the same fields as completionPct
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProfessionListResponse:
      type: object
      required: [professions]
      properties:
        professions:
          type: array
          items:
            type: string
          description: Merged list of well-known and community-contributed profession labels.

    UpsertProfileRequest:
      type: object
      required:
        - profession
        - specialty
        - qualificationCountry
        - qualificationType
        - qualificationYear
        - experienceYears
        - registrationStatus
        - residencyStatus
        - requiresSponsorship
      properties:
        profession:
          type: string
          description: The candidate's profession (free text; well-known values are suggested on the client).
        specialty:
          type: string
        qualificationCountry:
          type: string
        qualificationType:
          type: string
        qualificationYear:
          type: integer
        experienceYears:
          type: integer
        registrationStatus:
          type: string
          enum: [registered, not_registered, in_process]
        licenceReady:
          type: boolean
          nullable: true
        dbsClearanceLevel:
          $ref: '#/components/schemas/DbsClearanceLevel'
        safeguardingTrainingLevel:
          $ref: '#/components/schemas/SafeguardingTrainingLevel'
        residencyStatus:
          type: string
        requiresSponsorship:
          type: boolean
        preferredRegion:
          type: array
          items:
            type: string
          nullable: true
        alertFrequency:
          type: string
          enum: [daily, weekly, off]
          nullable: true
          default: weekly
          description: Weekly at launch. The daily value is retained only for backwards-compatible clients and is treated as weekly.
        preferredStartDate:
          type: string
          nullable: true
        profilePhotoKey:
          type: string
          nullable: true
        languages:
          type: array
          nullable: true
          items:
            type: string
        additionalNotes:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        streetAddress:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true

    RecordConsentRequest:
      type: object
      required: [termsVersion]
      properties:
        termsVersion:
          type: string
          minLength: 1

    ConsentRecord:
      type: object
      required: [id, userId, termsVersion, consentedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        termsVersion:
          type: string
        consentedAt:
          type: string
          format: date-time

    ConsentStatus:
      type: object
      required: [hasConsented]
      properties:
        hasConsented:
          type: boolean
        latestConsent:
          $ref: '#/components/schemas/ConsentRecord'
          nullable: true

    Document:
      type: object
      required: [id, userId, filename, mimeType, storageKey, disclaimerText, uploadedAt, isPrimary]
      properties:
        id:
          type: integer
        userId:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        storageKey:
          type: string
        fileSize:
          type: integer
          nullable: true
        documentType:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        isPrimary:
          type: boolean
        disclaimerText:
          type: string
        uploadedAt:
          type: string
          format: date-time
        parsedData:
          type: object
          nullable: true
          additionalProperties: true
          description: Parsed CV fields stored after AI extraction and user confirmation.

    DocumentList:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'

    RegisterDocumentRequest:
      type: object
      required: [filename, mimeType, storageKey]
      properties:
        filename:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        storageKey:
          type: string
          minLength: 1
        fileSize:
          type: integer
          nullable: true

    EligibilityOutcome:
      type: string
      enum: [eligible, not_eligible, ineligible]

    EligibilityResult:
      type: object
      required: [id, userId, outcome, explanationText, reasonCodes, rulesetId, rulesetVersion, profileSnapshotHash, reviewFlagged, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        outcome:
          $ref: '#/components/schemas/EligibilityOutcome'
        explanationText:
          type: string
        reasonCodes:
          type: array
          items:
            type: string
        pathways:
          type: array
          items:
            type: string
          nullable: true
        rulesetId:
          type: integer
        rulesetVersion:
          type: string
        profileSnapshotHash:
          type: string
        reviewFlagged:
          type: boolean
        reviewNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    EligibilityHistoryList:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/EligibilityResult'

    RulesetStatus:
      type: string
      enum: [draft, published]

    RulesetRegulator:
      type: string
      enum: [GMC, NMC, HCPC]

    Ruleset:
      type: object
      required: [id, regulator, version, status, effectiveDate, changelog, createdAt]
      properties:
        id:
          type: integer
        regulator:
          $ref: '#/components/schemas/RulesetRegulator'
        version:
          type: string
        status:
          $ref: '#/components/schemas/RulesetStatus'
        effectiveDate:
          type: string
          format: date-time
        changelog:
          type: string
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    RuleConditionOperator:
      type: string
      enum: [eq, neq, in, not_in, gte, lte, exists]

    RuleCondition:
      type: object
      required: [field, operator]
      properties:
        field:
          type: string
        operator:
          $ref: '#/components/schemas/RuleConditionOperator'
        value:
          nullable: true
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                type: string

    RulesetRule:
      type: object
      required: [id, rulesetId, ruleKey, conditions, outcome, reasonCode, explanationText, sortOrder]
      properties:
        id:
          type: integer
        rulesetId:
          type: integer
        ruleKey:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
        outcome:
          $ref: '#/components/schemas/EligibilityOutcome'
        reasonCode:
          type: string
        explanationText:
          type: string
        pathways:
          type: array
          items:
            type: string
          nullable: true
        sortOrder:
          type: integer

    RulesetWithRules:
      allOf:
        - $ref: '#/components/schemas/Ruleset'
        - type: object
          required: [rules]
          properties:
            rules:
