          in: query
          schema:
            type: boolean
          description: If true, return only companies with a stored direct employer email usable by Send CV
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Paginated sponsor licence companies
          content:
            application/json:
              schema:
