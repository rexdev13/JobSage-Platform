openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: JOBSAGE Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Profiles
    description: Candidate profile management.
  - name: Consent
    description: Consent capture and retrieval.
  - name: Documents
    description: Candidate document uploads.
  - name: Eligibility
    description: Eligibility evaluation against UK regulatory rulesets.
  - name: Rulesets
    description: Regulatory ruleset management (admin).
  - name: Decisions
    description: Decision record management (admin).
  - name: Roles
    description: Role catalogue management and candidate opportunity matching.
  - name: Sponsorship
    description: Sponsorship feasibility assessment.
  - name: Applications
    description: Candidate job application tracking.
  - name: Remediation
    description: Remediation plan generation and progress tracking.
  - name: Employer
    description: Employer portal — post jobs, generate AI descriptions, rank and pipeline candidates.
  - name: SponsorLicences
    description: UK Home Office sponsor licence register — search and filter licensed sponsors.
  - name: CandidatePortal
    description: Candidate Portal Phase 2 — cover letter generation, progress report, speculative applications.
  - name: SuperAdmin
    description: Super admin operational intelligence — platform stats, full user visibility, impersonation, and health metrics.
  - name: Readiness
    description: Candidate readiness check quota and plan.
  - name: Checkout
    description: Readiness check purchase sessions and provider events.
  - name: Support
    description: Public help and support ticket submission.
  - name: Feedback
    description: Public product feedback and administrator review.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerWithEmail
      summary: Register a new account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created, verification email sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccess'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithEmail
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Missing fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Email not verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and clear session
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email sent (always, to prevent enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          description: Missing email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          description: Invalid/expired token or weak password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/verify-email:
    get:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify email address via token
      description: Validates the email verification token, marks the user as verified, creates a session, and redirects to the app.
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: Email verification token from the verification email.
      responses:
        '302':
          description: Redirect to the app on success, or to login page with error on failure.
        '400':
          description: Invalid or expired token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerificationEmail
      summary: Resend email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Verification email sent if applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          description: Missing email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a private object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /professions:
    get:
      tags: [Profiles]
      operationId: listProfessions
      summary: List suggested profession values
      description: Returns the merged list of well-known professions and any custom professions that have been used by 3 or more candidates.
      responses:
        '200':
          description: Profession suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionListResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profiles/me:
    get:
      tags: [Profiles]
      operationId: getMyProfile
      summary: Get the current user's profile
      responses:
        '200':
          description: Profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '404':
          description: Profile not found (not yet created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [Profiles]
      operationId: upsertMyProfile
      summary: Create or update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProfileRequest'
      responses:
        '200':
          description: Profile saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /consent:
    post:
      tags: [Consent]
      operationId: recordConsent
      summary: Record user consent to terms and privacy policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordConsentRequest'
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [Consent]
      operationId: getMyConsent
      summary: Get the current user's consent status
      responses:
        '200':
          description: Consent status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatus'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /documents/upload:
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Upload a document file directly (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded and registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Validation error (invalid type, size exceeded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Upload failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /documents:
    get:
      tags: [Documents]
      operationId: listMyDocuments
      summary: List the current user's uploaded documents
      responses:
        '200':
          description: List of documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Documents]
      operationId: registerDocument
      summary: Register a document after upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDocumentRequest'
      responses:
        '201':
          description: Document registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /eligibility/evaluate:
    post:
      tags: [Eligibility]
      operationId: evaluateEligibility
      summary: Evaluate the current candidate's regulatory eligibility
      responses:
        '200':
          description: Evaluation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityResult'
        '400':
          description: Profile incomplete or no matching ruleset found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /eligibility/results/{id}:
    get:
      tags: [Eligibility]
      operationId: getEligibilityResult
      summary: Get a specific eligibility decision record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Decision record found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityResult'
        '404':
          description: Decision record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /eligibility/history:
    get:
      tags: [Eligibility]
      operationId: listEligibilityHistory
      summary: List the current candidate's eligibility decision history
      responses:
        '200':
          description: Decision history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityHistoryList'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rulesets:
    get:
      tags: [Rulesets]
      operationId: listRulesets
      summary: List all rulesets (filtered by regulator or status)
      parameters:
        - name: regulator
          in: query
          required: false
          schema:
            type: string
            enum: [GMC, NMC, HCPC]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, published]
      responses:
        '200':
          description: List of rulesets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetList'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Rulesets]
      operationId: createRuleset
      summary: Create a new draft ruleset (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRulesetRequest'
      responses:
        '201':
          description: Draft ruleset created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated or not admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rulesets/{id}:
    get:
      tags: [Rulesets]
      operationId: getRuleset
      summary: Get a ruleset with its rules
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ruleset with rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetWithRules'
        '404':
          description: Ruleset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rulesets/{id}/publish:
    patch:
      tags: [Rulesets]
      operationId: publishRuleset
      summary: Publish a draft ruleset (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ruleset published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '400':
          description: Ruleset not in draft state or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Ruleset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated or not admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rulesets/{id}/regression-test:
    post:
      tags: [Rulesets]
      operationId: runRegressionTest
      summary: Run regression tests against a ruleset using sample profiles (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegressionTestRequest'
      responses:
        '200':
          description: Regression test results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegressionTestResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Ruleset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated or not admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /decisions:
    get:
      tags: [Decisions]
      operationId: listDecisions
      summary: List all decision records (admin only)
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [eligible, not_eligible, ineligible]
        - name: reviewFlagged
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of decision records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecordList'
        '401':
          description: Not authenticated or not admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /documents/{id}:
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Document deleted.
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /documents/{id}/parse-cv:
    post:
      tags: [Documents]
      operationId: parseCv
      summary: Extract profile fields from an uploaded CV document using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Extracted CV fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvParseResult'
        '400':
          description: Invalid document or unsupported file type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /smart-apply/questions:
    get:
      tags: [Applications]
      operationId: getSmartApplyQuestions
      summary: Get the standard application questions
      responses:
        '200':
          description: Standard questions list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartApplyQuestionsResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /smart-apply/candidate-prefill:
    get:
      tags: [Applications]
      operationId: getSmartApplyCandidatePrefill
      summary: Get safe candidate contact fields for browser application form prefilling
      description: Returns an allowlisted subset of the authenticated candidate's contact details. Sensitive identity data and credentials are never returned.
      responses:
        '200':
          description: Safe candidate prefill fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartApplyCandidatePrefill'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /smart-apply/cv:
    get:
      tags: [Applications]
      operationId: downloadSmartApplyCurrentCv
      summary: Download the authenticated candidate's current CV
      description: Downloads the primary CV when one is selected, otherwise the newest CV document. The storage key is not exposed.
      responses:
        '200':
          description: CV file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The candidate does not have read access to the CV object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No current CV is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /roles/{id}/smart-apply/prefill:
    post:
      tags: [Applications]
      operationId: smartApplyPrefill
      summary: AI pre-fills application answers for a role based on the candidate's profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartApplyVacancyContext'
      responses:
        '200':
          description: Pre-filled answers with gap indicators.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartApplyPrefillResponse'
        '404':
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /smart-apply/draft/{roleId}:
    get:
      tags: [Applications]
      operationId: getSmartApplyDraft
      summary: Load a saved draft application for a role
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Draft answers (answers may be null if no draft saved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartApplyDraftResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [Applications]
      operationId: saveSmartApplyDraft
      summary: Save (upsert) a draft application for a role
      parameters:
        - name: roleId
          in: path
