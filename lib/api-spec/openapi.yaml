openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: JOBSAGE Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Profiles
    description: Candidate profile management.
  - name: Consent
    description: Consent capture and retrieval.
  - name: Documents
    description: Candidate document uploads.
  - name: Eligibility
    description: Eligibility evaluation against UK regulatory rulesets.
  - name: Rulesets
    description: Regulatory ruleset management (admin).
  - name: Decisions
    description: Decision record management (admin).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a private object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profiles/me:
    get:
      tags: [Profiles]
      operationId: getMyProfile
      summary: Get the current user's profile
      responses:
        '200':
          description: Profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '404':
          description: Profile not found (not yet created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [Profiles]
      operationId: upsertMyProfile
      summary: Create or update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProfileRequest'
      responses:
        '200':
          description: Profile saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /consent:
    post:
      tags: [Consent]
      operationId: recordConsent
      summary: Record user consent to terms and privacy policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordConsentRequest'
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [Consent]
      operationId: getMyConsent
      summary: Get the current user's consent status
      responses:
        '200':
          description: Consent status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatus'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /documents/upload:
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Upload a document file directly (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded and registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Validation error (invalid type, size exceeded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Upload failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /documents:
    get:
      tags: [Documents]
      operationId: listMyDocuments
      summary: List the current user's uploaded documents
      responses:
        '200':
          description: List of documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Documents]
      operationId: registerDocument
      summary: Register a document after upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDocumentRequest'
      responses:
        '201':
          description: Document registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /eligibility/evaluate:
    post:
      tags: [Eligibility]
      operationId: evaluateEligibility
      summary: Evaluate the current candidate's regulatory eligibility
      responses:
        '200':
          description: Evaluation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityResult'
        '400':
          description: Profile incomplete or no matching ruleset found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /eligibility/results/{id}:
    get:
      tags: [Eligibility]
      operationId: getEligibilityResult
      summary: Get a specific eligibility decision record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Decision record found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityResult'
        '404':
          description: Decision record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /eligibility/history:
    get:
      tags: [Eligibility]
      operationId: listEligibilityHistory
      summary: List the current candidate's eligibility decision history
      responses:
        '200':
          description: Decision history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityHistoryList'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rulesets:
    get:
      tags: [Rulesets]
      operationId: listRulesets
      summary: List all rulesets (filtered by regulator or status)
      parameters:
        - name: regulator
          in: query
          required: false
          schema:
            type: string
            enum: [GMC, NMC, HCPC]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, published]
      responses:
        '200':
          description: List of rulesets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetList'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Rulesets]
      operationId: createRuleset
      summary: Create a new draft ruleset (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRulesetRequest'
      responses:
        '201':
          description: Draft ruleset created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated or not admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rulesets/{id}:
    get:
      tags: [Rulesets]
      operationId: getRuleset
      summary: Get a ruleset with its rules
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ruleset with rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetWithRules'
        '404':
          description: Ruleset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rulesets/{id}/publish:
    patch:
      tags: [Rulesets]
      operationId: publishRuleset
      summary: Publish a draft ruleset (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ruleset published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '400':
          description: Ruleset not in draft state or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Ruleset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated or not admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rulesets/{id}/regression-test:
    post:
      tags: [Rulesets]
      operationId: runRegressionTest
      summary: Run regression tests against a ruleset using sample profiles (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegressionTestRequest'
      responses:
        '200':
          description: Regression test results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegressionTestResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Ruleset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated or not admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /decisions:
    get:
      tags: [Decisions]
      operationId: listDecisions
      summary: List all decision records (admin only)
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [eligible, not_eligible, ineligible, review]
        - name: reviewFlagged
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of decision records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecordList'
        '401':
          description: Not authenticated or not admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /documents/{id}:
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Document deleted.
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: [candidate, admin, reviewer]
          nullable: true

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1

    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, storageKey]
      properties:
        uploadURL:
          type: string
          format: uri
        storageKey:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    CandidateProfile:
      type: object
      required: [id, userId, profession, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        profession:
          type: string
          enum: [doctor, nurse, allied_health_professional, clinical_academic]
        specialty:
          type: string
          nullable: true
        qualificationCountry:
          type: string
          nullable: true
        qualificationType:
          type: string
          nullable: true
        qualificationYear:
          type: integer
          nullable: true
        experienceYears:
          type: integer
          nullable: true
        registrationStatus:
          type: string
          enum: [registered, not_registered, in_process]
          nullable: true
        licenceReady:
          type: boolean
          nullable: true
        residencyStatus:
          type: string
          nullable: true
        requiresSponsorship:
          type: boolean
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpsertProfileRequest:
      type: object
      required:
        - profession
        - specialty
        - qualificationCountry
        - qualificationType
        - qualificationYear
        - experienceYears
        - registrationStatus
        - residencyStatus
        - requiresSponsorship
      properties:
        profession:
          type: string
          enum: [doctor, nurse, allied_health_professional, clinical_academic]
        specialty:
          type: string
        qualificationCountry:
          type: string
        qualificationType:
          type: string
        qualificationYear:
          type: integer
        experienceYears:
          type: integer
        registrationStatus:
          type: string
          enum: [registered, not_registered, in_process]
        licenceReady:
          type: boolean
          nullable: true
        residencyStatus:
          type: string
        requiresSponsorship:
          type: boolean

    RecordConsentRequest:
      type: object
      required: [termsVersion]
      properties:
        termsVersion:
          type: string
          minLength: 1

    ConsentRecord:
      type: object
      required: [id, userId, termsVersion, consentedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        termsVersion:
          type: string
        consentedAt:
          type: string
          format: date-time

    ConsentStatus:
      type: object
      required: [hasConsented]
      properties:
        hasConsented:
          type: boolean
        latestConsent:
          $ref: '#/components/schemas/ConsentRecord'
          nullable: true

    Document:
      type: object
      required: [id, userId, filename, mimeType, storageKey, disclaimerText, uploadedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        storageKey:
          type: string
        fileSize:
          type: integer
          nullable: true
        disclaimerText:
          type: string
        uploadedAt:
          type: string
          format: date-time

    DocumentList:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'

    RegisterDocumentRequest:
      type: object
      required: [filename, mimeType, storageKey]
      properties:
        filename:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        storageKey:
          type: string
          minLength: 1
        fileSize:
          type: integer
          nullable: true

    EligibilityOutcome:
      type: string
      enum: [eligible, not_eligible, ineligible, review]

    EligibilityResult:
      type: object
      required: [id, userId, outcome, explanationText, reasonCodes, rulesetId, rulesetVersion, profileSnapshotHash, reviewFlagged, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        outcome:
          $ref: '#/components/schemas/EligibilityOutcome'
        explanationText:
          type: string
        reasonCodes:
          type: array
          items:
            type: string
        pathways:
          type: array
          items:
            type: string
          nullable: true
        rulesetId:
          type: integer
        rulesetVersion:
          type: string
        profileSnapshotHash:
          type: string
        reviewFlagged:
          type: boolean
        reviewNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    EligibilityHistoryList:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/EligibilityResult'

    RulesetStatus:
      type: string
      enum: [draft, published]

    RulesetRegulator:
      type: string
      enum: [GMC, NMC, HCPC]

    Ruleset:
      type: object
      required: [id, regulator, version, status, effectiveDate, changelog, createdAt]
      properties:
        id:
          type: integer
        regulator:
          $ref: '#/components/schemas/RulesetRegulator'
        version:
          type: string
        status:
          $ref: '#/components/schemas/RulesetStatus'
        effectiveDate:
          type: string
          format: date-time
        changelog:
          type: string
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    RuleConditionOperator:
      type: string
      enum: [eq, neq, in, not_in, gte, lte, exists]

    RuleCondition:
      type: object
      required: [field, operator]
      properties:
        field:
          type: string
        operator:
          $ref: '#/components/schemas/RuleConditionOperator'
        value:
          nullable: true

    RulesetRule:
      type: object
      required: [id, rulesetId, ruleKey, conditions, outcome, reasonCode, explanationText, sortOrder]
      properties:
        id:
          type: integer
        rulesetId:
          type: integer
        ruleKey:
          type: string
