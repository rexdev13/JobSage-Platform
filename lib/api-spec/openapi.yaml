        - name: hasVacancies
          in: query
          schema:
            type: boolean
          description: If true, return only companies with active vacancies on the platform
        - name: region
          in: query
          schema:
            type: array
            items:
              type: string
          explode: true
          description: Filter by one or more UK regions (e.g. London, North West, Scotland)
        - name: bookmarkedOnly
          in: query
          schema:
            type: boolean
          description: If true, return only the candidate's bookmarked companies
