    <title>JOBSAGE Smart Apply</title>
    <!--
      Google Fonts is intentionally omitted here. Chrome MV3 extension popup
      pages block external stylesheets under stricter CSPs in newer Chrome
      versions. The popup uses inline styles with system-font fallbacks
      (BRAND.fontSans / fontDisplay) so the UI renders correctly without the
      webfonts. The content-script sidebar loads fonts via ensureBrandFonts()
      which injects them into the host document where the page CSP applies.
    -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/popup.tsx"></script>
